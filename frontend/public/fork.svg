<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 60" width="20" height="60">
  <!-- L14: 포크 그림. 손잡이가 위, 갈퀴 끝이 아래(y=60)다. 화면에서 45도 돌려 갈퀴가 왼쪽 아래(버튼 쪽)를 향하게 한다. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f979f"/>
      <stop offset="0.45" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#9aa2aa"/>
    </linearGradient>
  </defs>
  <g fill="url(#metal)" stroke="#5c636a" stroke-width="1" stroke-linejoin="round">
    <!-- 손잡이 -->
    <rect x="6.5" y="0.5" width="7" height="30" rx="3.5"/>
    <!-- 목과 머리 -->
    <path d="M7.5 29 L12.5 29 L17.5 38 L17.5 41 L2.5 41 L2.5 38 Z"/>
    <!-- 갈퀴 4개 -->
    <path d="M2.5 40 h3 v17.5 a1.5 1.5 0 0 1 -3 0 Z"/>
    <path d="M6.5 40 h3 v18.5 a1.5 1.5 0 0 1 -3 0 Z"/>
    <path d="M10.5 40 h3 v18.5 a1.5 1.5 0 0 1 -3 0 Z"/>
    <path d="M14.5 40 h3 v17.5 a1.5 1.5 0 0 1 -3 0 Z"/>
  </g>
</svg>
